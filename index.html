<!-- استيراد مكتبات Firebase اللازمة -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // إعدادات تطبيقك التي نسختها من Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDjNe5QIA6QszmK1M-cJsac8WsIh1kENVU",
    authDomain: "raed-ride.firebaseapp.com",
    projectId: "raed-ride",
    storageBucket: "raed-ride.firebasestorage.app",
    messagingSenderId: "640577773413",
    appId: "1:640577773413:web:befabf53956263bb808b8c",
    measurementId: "G-2M4N38WJSL",
    databaseURL: "https://raed-ride-default-rtdb.firebaseio.com" // تأكد من مطابقة هذا الرابط لعنوان قاعدة بياناتك
  };

  // تهيئة Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // --- وظيفة نشر طلب رحلة جديد (للراكب) ---
  window.postRideRequest = function() {
    const fromLocation = document.getElementById('p-from').value;
    const toLocation = document.getElementById('p-to').value;
    const priceOffer = document.getElementById('p-price-num').value;
    
    // الحصول على نوع المركبة المختارة
    const selectedVehicleElement = document.querySelector('.vehicle-opt.selected .v-name');
    const vehicleType = selectedVehicleElement ? selectedVehicleElement.innerText : "غير محدد";

    if (fromLocation && toLocation && priceOffer) {
      const ridesRef = ref(db, 'rides/');
      const newRideRef = push(ridesRef);
      
      set(newRideRef, {
        passengerName: "صابر عليوا",
        from: fromLocation,
        to: toLocation,
        price: priceOffer,
        vehicle: vehicleType,
        status: "waiting",
        timestamp: Date.now()
      }).then(() => {
        // إظهار واجهة انتظار السائق بعد النجاح
        showStep2Passenger(fromLocation, toLocation, priceOffer, vehicleType);
      }).catch((error) => {
        console.error("خطأ في إرسال الطلب: ", error);
        alert("حدث خطأ أثناء نشر الطلب، تأكد من إعدادات الحماية في Firebase.");
      });
    } else {
      alert("برجاء إكمال بيانات الرحلة أولاً.");
    }
  };

  // --- وظيفة تحديث قائمة الطلبات (للسائق) ---
  const ridesListRef = ref(db, 'rides/');
  onValue(ridesListRef, (snapshot) => {
    const data = snapshot.val();
    const listContainer = document.getElementById('driver-offers-list');
    
    if (data && listContainer) {
      listContainer.innerHTML = ""; // مسح القائمة الحالية لتحديثها
      Object.keys(data).forEach(key => {
        const ride = data[key];
        if (ride.status === "waiting") {
          const card = `
            <div class="rider-card" onclick="viewRideDetails('${key}')">
              <div class="rider-avatar">👤</div>
              <div class="rider-info">
                <div class="rider-name">${ride.passengerName}</div>
                <div class="rider-meta">من: ${ride.from} ⮕ إلى: ${ride.to}</div>
                <div class="vehicle-tag" style="font-size: 10px; color: #ffcc00;">المطلوب: ${ride.vehicle}</div>
              </div>
              <div class="rider-price">
                <div class="amount">${ride.price}</div>
                <div class="currency">ج.م</div>
              </div>
            </div>`;
          listContainer.innerHTML += card;
        }
      });
    }
  });

  // دوال مساعدة للتحكم في الواجهة (UI Control)
  function showStep2Passenger(f, t, p, v) {
    const step1 = document.getElementById('p-step1');
    const step2 = document.getElementById('p-step2');
    if(step1) step1.style.display = 'none';
    if(step2) {
        step2.style.display = 'block';
        document.getElementById('p-sum-from').innerText = f;
        document.getElementById('p-sum-to').innerText = t;
        document.getElementById('p-initial-offer').innerText = p + " ج.م";
    }
  }

  console.log("رعد رايد متصل الآن بـ Firebase بنجاح! ⚡");
</script>
